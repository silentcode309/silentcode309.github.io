<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultCTF</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    /* ======================
       FIREBASE CONFIG
       ====================== */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyDg3D0E_-jroFn979TlCLSrgcGpP_887BQ",
    authDomain: "vaultctf.firebaseapp.com",
    projectId: "vaultctf",
    storageBucket: "vaultctf.firebasestorage.app",
    messagingSenderId: "589839331076",
    appId: "1:589839331076:web:584266b7d17956c26b2a51",
    measurementId: "G-XMCZ80Q8Z5"
  };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    /* ======================
       STATE
       ====================== */

    let vaults = [];
    let currentUser = null;
    let userData = null;

    const vaultContainer = document.getElementById("vaults");
    const leaderboardContainer = document.getElementById("leaderboard");
    const authStatus = document.getElementById("authStatus");
    const logoutBtn = document.getElementById("logoutBtn");

    /* ======================
       UTIL: HASH FLAG
       ====================== */

    async function sha256(text) {
      const data = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    /* ======================
       AUTH (USERNAME-ONLY)
       ====================== */

    async function authPrompt() {
      const mode = prompt("Type 'login' or 'register'");
      if (!mode) return;

      const username = prompt("Username");
      const password = prompt("Password (min 6 chars)");
      const fakeEmail = `${username}@vaultctf.local`;

      try {
        if (mode === "register") {
          const cred = await createUserWithEmailAndPassword(auth, fakeEmail, password);
          await updateProfile(cred.user, { displayName: username });
          await setDoc(doc(db, "users", cred.user.uid), {
            username,
            gold: 0,
            cracked: 0,
            solves: {},
            uploaded: false
          });
        } else {
          await signInWithEmailAndPassword(auth, fakeEmail, password);
        }
      } catch (err) {
        alert(err.message);
      }
    }

    onAuthStateChanged(auth, async user => {
      if (!user) {
        authStatus.textContent = "Not logged in";
        logoutBtn.style.display = "none";
        authPrompt();
        return;
      }

      currentUser = user;
      logoutBtn.style.display = "inline-block";
      authStatus.textContent = user.displayName;

      const userSnap = await getDoc(doc(db, "users", user.uid));
      userData = userSnap.data();

      document.getElementById("gold").textContent = userData.gold;
      document.getElementById("cracked").textContent = userData.cracked;

      await loadVaults();
      renderVaults();
      loadLeaderboard();
    });

    /* ======================
       VAULT LOGIC (PERSISTENT)
       ====================== */

    async function loadVaults() {
      const snap = await getDocs(collection(db, "vaults"));
      vaults = [];
      snap.forEach(d => vaults.push(d.data()));
    }

    async function attemptVault(index) {
      const input = prompt("Submit flag");
      const hash = await sha256(input);
      const vault = vaults[index];

      if (hash === vault.flagHash && !userData.solves[vault.name]) {
        userData.solves[vault.name] = true;
        userData.gold += vault.reward;
        userData.cracked += 1;

        await updateDoc(doc(db, "users", currentUser.uid), userData);

        document.getElementById("gold").textContent = userData.gold;
        document.getElementById("cracked").textContent = userData.cracked;

        renderVaults();
        loadLeaderboard();
      } else {
        alert("Incorrect or already solved");
      }
    }

    /* ======================
       ADMIN: UPLOAD VAULT
       ====================== */

    window.startVaultUpload = () => {
      const input = document.getElementById("vaultFileInput");
      input.value = "";
      input.click();
    };

    document.getElementById("vaultFileInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];

      const name = prompt("Vault name");
      const desc = prompt("Description");
      const flag = prompt("Flag");
      const reward = Number(prompt("Gold reward"));

      if (!name || !flag || !reward) return;

      let fileURL = null;
      if (file) {
        const fileRef = ref(storage, `vaults/${name}/${file.name}`);
        await uploadBytes(fileRef, file);
        fileURL = await getDownloadURL(fileRef);
      }

      const flagHash = await sha256(flag);

      await setDoc(doc(db, "vaults", name), {
        name,
        desc,
        flagHash,
        reward,
        fileURL
      });

      userData.uploaded = true;
      await updateDoc(doc(db, "users", currentUser.uid), { uploaded: true });

      await loadVaults();
      renderVaults();
    });

    /* ======================
       LEADERBOARD
       ====================== */

    async function loadLeaderboard() {
      leaderboardContainer.innerHTML = "";
      const snap = await getDocs(collection(db, "users"));
      const users = [];

      snap.forEach(d => users.push(d.data()));
      users.sort((a, b) => b.gold - a.gold);

      users.forEach((u, i) => {
        const row = document.createElement("div");
        row.textContent = `${i + 1}. ${u.username} — ${u.gold}`;
        leaderboardContainer.appendChild(row);
      });
    }

    window.logout = async () => {
      await signOut(auth);
      location.reload();
    };
  </script>

  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121826;
      --accent: #f5c542;
      --text: #e6e9ef;
      --muted: #9aa4b2;
    }

    body { margin: 0; font-family: system-ui; background: radial-gradient(circle at top, #141a2b, var(--bg)); color: var(--text); }
    header { display: flex; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #1f263d; }
    main { display: grid; grid-template-columns: 240px 1fr 260px; min-height: calc(100vh - 64px); }
    aside { background: var(--panel); padding: 16px; border-right: 1px solid #1f263d; }
    .vault-grid { padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .vault { background: linear-gradient(180deg, #161d33, #0e1322); border: 1px solid #252c4a; border-radius: 12px; padding: 16px; }
    button { margin-top: 10px; width: 100%; padding: 8px; background: var(--accent); border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <strong>VaultCTF</strong>
    <div>
      <span id="authStatus">Loading...</span> |
      Gold: <span id="gold">0</span> |
      Cracked: <span id="cracked">0</span>
      <button id="logoutBtn" onclick="logout()" style="width:auto;display:none;margin-left:10px">Logout</button>
    </div>
  </header>

  <main>
    <aside>
      <h3>Admin</h3>
      <button onclick="startVaultUpload()">Upload Vault</button>
      <input id="vaultFileInput" type="file" style="display:none" />
      <p class="muted">Upload at least one vault to unlock gameplay.</p>
    </aside>

    <section class="vault-grid" id="vaults"></section>

    <aside>
      <h3>Leaderboard</h3>
      <div id="leaderboard" class="muted"></div>
    </aside>
  </main>
</body>
</html>
